events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The active color is chosen by /etc/nginx/conf.d/active.conf, which is
    # bind-mounted from the host so it can be rewritten and hot-reloaded
    # without rebuilding or restarting this container.
    upstream search_backend {
        include /etc/nginx/conf.d/active.conf;
    }

    server {
        listen 8083;

        location / {
            proxy_pass http://search_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
